# Oracle 巡检配置文件 - 采集端（服务器）
# =========================
# 说明: 以下配置项如被注释，则使用操作系统当前环境变量
#       如取消注释并填写值，则以配置文件为准

# 数据库连接配置
# 默认使用操作系统认证 (sqlplus / as sysdba)
# v4.2 禁止在配置文件中保存数据库明文密码。
# 如需运行时交互输入 IP、端口、SID、账号、密码和角色，请改为 on。
# 密码只在终端隐藏输入，不会写入配置、命令行参数、日志或采集包。
DB_INTERACTIVE_LOGIN=off
# 默认使用 OS 认证；如已配置 Oracle Wallet，可填写 TNS/WALLET 别名:
#ORACLE_SID=orcl
#ORACLE_HOME=/u01/app/oracle/product/19c/dbhome_1
#DB_WALLET_ALIAS=orcl_wallet

# 巡检项开关 (on/off)
CHECK_HOST=on
CHECK_DB=on
CHECK_SECURITY=on

# 可能涉及额外 Oracle 授权的 AWR/DBA_HIST 采集，确认授权后再开启
CHECK_AWR=off

# 是否在性能明细中采集 SQL 文本；关闭时仍保留 SQL_ID 与指标
COLLECT_SQL_TEXT=off

# 数据输出目录（相对于 collector 根目录；也可填写绝对路径）
RAW_DATA_DIR=output/raw

# 调试模式 (on/off)
# 开启后输出每一步执行的详细信息，便于定位问题
DEBUG=off

# 报告显示配置
# 页面底部版权/标识信息，留空则使用默认值
REPORT_FOOTER=Generated by Dotease Limited
