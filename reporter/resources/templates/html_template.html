<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${REPORT_TITLE}</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --radius: 8px;
            --radius-sm: 5px;
            --shadow: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --sidebar-w: 260px;
            --header-bg: #0f172a;
            --host: #0284c7;
            --host-light: #e0f2fe;
            --db: #7c3aed;
            --db-light: #ede9fe;
            --cdb: #0891b2;
            --cdb-light: #ecfeff;
            --rac: #db2777;
            --rac-light: #fce7f3;
            --sec: #d97706;
            --sec-light: #fef3c7;
            --ok: #059669;
            --ok-bg: #ecfdf5;
            --warn: #d97706;
            --warn-bg: #fffbeb;
            --crit: #dc2626;
            --crit-bg: #fef2f2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 14px;
        }

        /* ===== Layout ===== */
        .report-shell { display: flex; min-height: 100vh; }
        .sidebar {
            width: var(--sidebar-w);
            background: var(--header-bg);
            color: #cbd5e1;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            overflow-y: auto;
            z-index: 100;
            padding: 20px 0;
        }
        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-width: 0;
            padding: 28px 32px 48px;
            max-width: calc(100% - var(--sidebar-w));
        }

        /* ===== Sidebar ===== */
        .sidebar-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 16px;
        }
        .sidebar-brand .logo {
            font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
            text-transform: uppercase; color: #64748b; margin-bottom: 4px;
        }
        .sidebar-brand .title {
            font-size: 14px; font-weight: 600; color: #f1f5f9; line-height: 1.4;
        }
        .sidebar-brand .meta {
            font-size: 11px; color: #64748b; margin-top: 6px;
        }
        .sidebar-brand .meta span { display: block; line-height: 1.5; }

        .nav-group { padding: 8px 12px; }
        .nav-group-label {
            font-size: 10px; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; color: #475569;
            padding: 4px 8px 8px;
        }
        .nav-link {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 12px; border-radius: 6px;
            color: #94a3b8; text-decoration: none;
            font-size: 12px; transition: all 0.15s;
        }
        .nav-link:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }
        .nav-link.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 1px 4px rgba(0,0,0,0.18);
        }
        .nav-category { margin-bottom: 5px; }
        .nav-category-link { font-weight: 600; color: #cbd5e1; }
        .nav-check-list { margin: 1px 0 7px 13px; }
        .nav-check {
            padding: 5px 10px;
            font-size: 11px;
            gap: 7px;
        }
        .nav-check-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nav-link .dot {
            width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
        }
        .nav-link .dot.host { background: var(--host); }
        .nav-link .dot.db { background: var(--db); }
        .nav-link .dot.cdb { background: var(--cdb); }
        .nav-link .dot.rac { background: var(--rac); }
        .nav-link .dot.sec { background: var(--sec); }
        .nav-link .dot.ok { background: var(--ok); }
        .nav-link .dot.warn { background: var(--warn); }
        .nav-link .dot.crit { background: var(--crit); }
        .nav-link .dot.unknown { background: #64748b; }
        .nav-link .dot.summary { background: #94a3b8; }

        /* ===== Report Header ===== */
        .report-header {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .report-header h1 { font-size: 20px; font-weight: 700; color: var(--text); }
        .report-header .project-name {
            margin: 1px 0 3px; color: #315b88; font-size: 11px;
            font-weight: 600; letter-spacing: 0.08em;
        }
        .report-header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        .score-ring {
            width: 72px; height: 72px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 700; color: white; flex-shrink: 0;
        }
        .score-ring.good { background: linear-gradient(135deg, #059669, #10b981); }
        .score-ring.warn { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .score-ring.crit { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .score-ring.unknown { background: linear-gradient(135deg, #64748b, #94a3b8); }
        .header-info { flex: 1; min-width: 200px; }
        .header-meta { display: flex; gap: 20px; font-size: 12px; color: var(--text-muted); margin-top: 6px; flex-wrap: wrap; }
        .header-meta span { white-space: nowrap; }

        /* ===== Summary Cards ===== */
        .summary-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 14px;
            text-align: center;
            border-top: 3px solid transparent;
        }
        .summary-card.sc-ok { border-top-color: var(--ok); }
        .summary-card.sc-warn { border-top-color: var(--warn); }
        .summary-card.sc-crit { border-top-color: var(--crit); }
        .summary-card.sc-info { border-top-color: #0284c7; }
        .summary-card.sc-confidence { border-top-color: #64748b; }
        .summary-card.sc-total { border-top-color: #6366f1; }
        .sc-number { font-size: 28px; font-weight: 700; }
        .sc-text { font-size: 20px; font-weight: 700; margin: 5px 0 4px; }
        .sc-ok .sc-number { color: var(--ok); }
        .sc-warn .sc-number { color: var(--warn); }
        .sc-crit .sc-number { color: var(--crit); }
        .sc-info .sc-number { color: #0284c7; }
        .sc-confidence .sc-text { color: #475569; }
        .sc-total .sc-number { color: #6366f1; }
        .sc-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        /* ===== Action Panel ===== */
        .action-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .action-panel-header {
            padding: 12px 20px;
            font-weight: 600; font-size: 14px;
            display: flex; align-items: center; justify-content: space-between;
            background: #fef2f2; color: #991b1b;
            border-bottom: 1px solid #fecaca;
        }
        .action-panel-header .count {
            background: var(--crit); color: white;
            padding: 2px 10px; border-radius: 12px; font-size: 12px;
        }
        .action-list { padding: 8px 0; }
        .action-item {
            padding: 8px 20px; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border);
            color: inherit; text-decoration: none;
            transition: background 0.15s, padding-left 0.15s;
        }
        .action-item:hover, .action-item:focus {
            background: #f8fafc;
            padding-left: 24px;
            outline: none;
        }
        .action-item:last-child { border-bottom: none; }
        .action-item .badge {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 1px 8px; border-radius: 10px;
            font-size: 11px; font-weight: 600; white-space: nowrap;
        }
        .badge {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 10px; border-radius: 10px;
            font-size: 11px; font-weight: 600; white-space: nowrap;
            line-height: 1.4;
        }
        .badge-ok { background: var(--ok-bg); color: #065f46; }
        .badge-warn { background: var(--warn-bg); color: #92400e; }
        .badge-crit { background: var(--crit-bg); color: #991b1b; }
        .badge-info { background: #e0f2fe; color: #075985; }
        .badge-unknown { background: #f1f5f9; color: #334155; }

        /* ===== TOC Panel ===== */
        .toc-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .toc-header {
            padding: 14px 20px;
            font-weight: 600; font-size: 14px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(90deg, #eef2ff, #f0f9ff);
            color: #312e81;
            border-bottom: 1px solid var(--border);
        }
        .toc-count {
            background: #6366f1; color: white;
            padding: 2px 10px; border-radius: 12px; font-size: 12px;
            font-weight: 500;
        }
        .toc-grid {
            padding: 10px 16px 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 6px 12px;
        }
        .toc-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 12.5px; color: var(--text-primary);
            text-decoration: none;
            transition: background 0.15s, transform 0.15s;
            min-width: 0;
        }
        .toc-item:hover {
            background: #f1f5f9;
            transform: translateX(2px);
        }
        .toc-dot {
            width: 9px; height: 9px; border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
        }
        .dot-ok { background: var(--ok); }
        .dot-warn { background: var(--warn); }
        .dot-crit { background: var(--crit); }
        .dot-info { background: #0284c7; }
        .dot-unknown { background: #64748b; }
        .toc-name {
            flex: 1; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .toc-value {
            color: var(--text-secondary); font-size: 11px;
            white-space: nowrap;
            max-width: 90px; overflow: hidden; text-overflow: ellipsis;
        }

        /* ===== Section ===== */
        .section { min-width: 0; max-width: 100%; margin-bottom: 28px; scroll-margin-top: 12px; }
        .section-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 14px;
        }
        .sec-icon {
            width: 32px; height: 32px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: white; flex-shrink: 0;
        }
        .section-header.host .sec-icon { background: var(--host); }
        .section-header.db .sec-icon { background: var(--db); }
        .section-header.cdb .sec-icon { background: var(--cdb); }
        .section-header.rac .sec-icon { background: var(--rac); }
        .section-header.sec .sec-icon { background: var(--sec); }
        .sec-title { font-size: 16px; font-weight: 600; }
        .sec-subtitle { font-size: 12px; color: var(--text-secondary); }

        /* ===== Check Card (for host items) ===== */
        .check-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 12px;
            min-width: 0;
            max-width: 100%;
        }
        .check-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 18px;
            border-left: 3px solid transparent;
            scroll-margin-top: 12px;
            min-width: 0;
            max-width: 100%;
        }
        .check-card.ok { border-left-color: var(--ok); }
        .check-card.warn { border-left-color: var(--warn); }
        .check-card.crit { border-left-color: var(--crit); }
        .check-card.info { border-left-color: #0284c7; }
        .check-card.unknown { border-left-color: #64748b; }
        .cc-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 4px;
        }
        .cc-name { font-weight: 600; font-size: 13px; }
        .cc-value { font-size: 20px; font-weight: 700; margin: 2px 0; }
        .check-card.ok .cc-value { color: var(--ok); }
        .check-card.warn .cc-value { color: var(--warn); }
        .check-card.crit .cc-value { color: var(--crit); }
        .check-card.info .cc-value { color: #0284c7; }
        .check-card.unknown .cc-value { color: #475569; }
        .cc-name, .cc-value, .cc-detail, .check-result, .cc-suggestion, .check-purpose {
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .cc-detail { font-size: 12px; color: var(--text-secondary); }
        .check-purpose {
            margin: 10px 0 2px; padding-top: 7px;
            border-top: 1px dashed var(--border);
            color: var(--text-secondary); font-size: 12px; line-height: 1.6;
        }
        .check-purpose strong { color: var(--text-primary); }
        .check-result { margin-top: 5px; color: var(--text-secondary); line-height: 1.6; }
        .cc-suggestion {
            margin-top: 6px; padding: 5px 10px;
            background: var(--warn-bg); border-left: 3px solid var(--warn);
            font-size: 12px; color: #92400e; border-radius: 3px;
        }
        .cc-extra { min-width: 0; max-width: 100%; margin-top: 8px; }
        .extra-toggle {
            display: inline-block; padding: 2px 10px;
            background: #f1f5f9; border: 1px solid var(--border);
            border-radius: 4px; font-size: 11px; color: var(--text-secondary);
            cursor: pointer; user-select: none; transition: all 0.15s;
        }
        .extra-toggle:hover { background: #e2e8f0; }
        .extra-content { display: none; min-width: 0; max-width: 100%; margin-top: 6px; }
        .extra-content.open { display: block; }
        .detail-subtitle {
            font-size: 12px; font-weight: 600; color: var(--text-primary);
            margin: 10px 0 4px; padding-left: 8px;
            border-left: 3px solid #6366f1;
        }
        .detail-list {
            margin: 4px 0 8px; padding-left: 22px;
            font-size: 12px; color: var(--text-secondary);
            line-height: 1.7;
        }
        .detail-list li { margin-bottom: 2px; }
        .detail-note {
            margin: 6px 0;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ===== Table Wrap (for db/cdb/rac/sec items) ===== */
        .table-wrap {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-gutter: stable;
            margin-bottom: 12px;
        }
        .table-wrap-header {
            padding: 10px 18px;
            font-weight: 600; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
        }
        .table-wrap.host-style .table-wrap-header { background: var(--host-light); color: var(--host); }
        .table-wrap.db-style .table-wrap-header { background: var(--db-light); color: var(--db); }
        .table-wrap.cdb-style .table-wrap-header { background: var(--cdb-light); color: var(--cdb); }
        .table-wrap.rac-style .table-wrap-header { background: var(--rac-light); color: var(--rac); }
        .table-wrap.sec-style .table-wrap-header { background: var(--sec-light); color: var(--sec); }

        .check-table {
            width: 100%; min-width: 100%; max-width: 100%;
            border-collapse: collapse; font-size: 13px;
        }
        .report-detail-table { table-layout: fixed; min-width: 720px; }
        .report-detail-table .check-col-name { width: 16%; }
        .report-detail-table .check-col-status { width: 9%; }
        .report-detail-table .check-col-value { width: 17%; }
        .report-detail-table .check-col-detail { width: 58%; }
        .fleet-matrix-table { min-width: 1080px; }
        .category-matrix-table { min-width: 720px; }
        .check-table th {
            padding: 8px 14px; text-align: left; font-weight: 600;
            font-size: 11px; color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
            background: #f8fafc; text-transform: uppercase; letter-spacing: 0.5px;
            overflow-wrap: anywhere; word-break: break-word;
        }
        .check-table td {
            padding: 10px 14px; border-bottom: 1px solid var(--border);
            vertical-align: middle;
            min-width: 0; max-width: 100%;
            overflow-wrap: anywhere; word-break: break-word;
        }
        .check-table td.detail-cell { min-width: 0; max-width: 0; vertical-align: top; }
        .check-table tbody tr:hover { background: #f8fafc; }
        .check-table tbody tr[id] { scroll-margin-top: 12px; }
        .check-table .center { text-align: center; white-space: nowrap; }
        .check-table .status-cell { white-space: nowrap; }
        .check-table .status-text {
            display: inline-block;
            padding: 2px 10px; border-radius: 10px;
            font-size: 11px; font-weight: 600;
            white-space: nowrap;
        }
        .status-text.ok { background: var(--ok-bg); color: #065f46; }
        .status-text.warn { background: var(--warn-bg); color: #92400e; }
        .status-text.crit { background: var(--crit-bg); color: #991b1b; }

        /* ===== Data Table ===== */
        .data-table-wrap {
            width: 100%; max-width: 100%; min-width: 0;
            overflow-x: auto; overflow-y: hidden;
            margin-top: 6px;
            border-radius: 4px;
            scrollbar-gutter: stable;
        }
        .data-table-wrap:focus {
            outline: 2px solid #93c5fd;
            outline-offset: 1px;
        }
        .data-table {
            width: 100%; min-width: 100%; max-width: 100%;
            table-layout: fixed; border-collapse: collapse; font-size: 12px;
        }
        .data-table.data-table-wide { min-width: 840px; table-layout: auto; }
        .data-table.data-table-very-wide { min-width: 1080px; table-layout: auto; }
        .data-table th {
            background: #f1f5f9; color: #475569; padding: 5px 10px;
            text-align: left; font-weight: 600; font-size: 11px;
            border: 1px solid var(--border);
            white-space: normal; overflow-wrap: anywhere; word-break: break-word;
        }
        .data-table td {
            padding: 4px 10px; border: 1px solid var(--border); font-size: 12px;
            min-width: 0; max-width: 420px; vertical-align: top;
            white-space: normal; overflow-wrap: anywhere; word-break: break-word;
        }
        .data-table tbody tr:nth-child(even) { background: #f8fafc; }
        .data-table tbody tr:hover { background: #eff6ff; }
        .data-table td.metric-warn {
            background: var(--warn-bg); color: #92400e; font-weight: 700;
        }
        .data-table td.metric-crit {
            background: var(--crit-bg); color: #991b1b; font-weight: 700;
        }

        /* ===== Bar Chart ===== */
        .bar-chart { margin-top: 8px; }
        .bar-row {
            display: flex; align-items: center; margin-bottom: 4px; font-size: 12px;
        }
        .bar-label {
            width: 120px; text-align: right; padding-right: 8px;
            color: var(--text-secondary); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .bar-track {
            flex: 1; height: 18px; background: #f1f5f9;
            border-radius: 3px; overflow: hidden;
        }
        .bar-fill {
            height: 100%; border-radius: 3px; transition: width 0.3s; min-width: 2px;
        }
        .bar-fill-ok { background: linear-gradient(90deg, #10b981, #059669); }
        .bar-fill-warn { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .bar-fill-crit { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .bar-value {
            width: 50px; text-align: left; padding-left: 6px;
            font-weight: 600; font-size: 12px;
        }
        .health-percentage {
            margin: 8px 0 12px;
            max-width: 720px;
        }
        .health-percentage-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .health-percentage-head strong { color: var(--text); font-size: 14px; }
        .health-percentage-track {
            height: 20px;
            overflow: hidden;
            border-radius: 5px;
            background: #e2e8f0;
            box-shadow: inset 0 1px 2px rgba(15,23,42,0.08);
        }
        .health-percentage-fill {
            height: 100%;
            min-width: 2px;
            border-radius: 5px;
        }

        /* ===== Fleet Summary ===== */
        .section-header.summary .sec-icon { background: #0f172a; }
        .report-summary-content {
            background: var(--card-bg); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 18px 22px; color: var(--text);
            font-size: 13.5px; line-height: 1.8;
        }
        .report-summary-content h3 {
            margin: 14px 0 7px; color: var(--navy); font-size: 15px;
        }
        .report-summary-content h3:first-child { margin-top: 0; }
        .report-summary-content p { margin: 0 0 7px; }
        .report-summary-content ul,
        .report-summary-content ol { margin: 5px 0 0; padding-left: 24px; }
        .report-summary-content li { margin-bottom: 5px; }
        .report-summary-content .summary-note { color: var(--text-secondary); }
        .doc-control {
            width: 100%; border-collapse: collapse; font-size: 13px;
            max-width: 100%; table-layout: fixed;
            background: var(--card-bg); margin-bottom: 16px;
        }
        .doc-control th, .doc-control td {
            padding: 8px 14px; border: 1px solid var(--border); text-align: left;
            min-width: 0; overflow-wrap: anywhere; word-break: break-word;
        }
        .doc-control th {
            width: 148px; background: #f8fafc; color: var(--text-secondary);
            font-size: 12px; font-weight: 600;
        }
        .risk-pill {
            display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 700;
        }
        .risk-high { background: var(--crit-bg); color: #991b1b; }
        .risk-mid { background: var(--warn-bg); color: #92400e; }
        .risk-low { background: var(--ok-bg); color: #065f46; }
        .narrative {
            background: var(--card-bg); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 20px;
            font-size: 13.5px; line-height: 1.85; color: var(--text);
        }
        .narrative p { margin-bottom: 8px; }
        .narrative p:last-child { margin-bottom: 0; }
        .rank-list {
            background: var(--card-bg); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 12px 18px 16px; margin-bottom: 20px;
        }
        .rank-row {
            display: flex; align-items: center; gap: 10px;
            margin: 8px 0; font-size: 13px;
        }
        .rank-idx { width: 24px; color: var(--text-muted); font-weight: 700; }
        .rank-label {
            width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .rank-row .bar-track {
            flex: 1; height: 16px; background: #f1f5f9; border-radius: 3px; overflow: hidden;
        }
        .rank-score { width: 52px; font-weight: 700; text-align: right; }
        .cluster-list { display: grid; gap: 10px; margin-bottom: 20px; }
        .cluster-card {
            background: var(--card-bg); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 14px 18px;
            border-left: 3px solid var(--warn);
        }
        .cluster-card.crit { border-left-color: var(--crit); }
        .cluster-head {
            display: flex; justify-content: space-between; gap: 12px;
            align-items: center; font-weight: 600; flex-wrap: wrap;
        }
        .cluster-sys { margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
        .cluster-sys div { margin: 3px 0; }
        .sys-card {
            background: var(--card-bg); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 12px;
            border-left: 3px solid var(--ok);
            scroll-margin-top: 12px;
        }
        .sys-card.warn { border-left-color: var(--warn); }
        .sys-card.crit { border-left-color: var(--crit); }
        .sys-card.unknown { border-left-color: #64748b; }
        .sys-title { font-size: 15px; font-weight: 700; }
        .sys-meta {
            font-size: 12px; color: var(--text-muted); margin: 4px 0 8px;
            display: flex; gap: 14px; flex-wrap: wrap;
        }
        .conclusion-box {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px;
        }
        .conclusion-box ol { padding-left: 22px; }
        .conclusion-box li { margin: 8px 0; line-height: 1.7; }
        .signoff {
            width: 100%; max-width: 100%; table-layout: fixed;
            border-collapse: collapse; margin-top: 8px;
            background: var(--card-bg);
        }
        .signoff th, .signoff td {
            border: 1px solid var(--border); padding: 14px 12px; text-align: center;
            min-width: 0; overflow-wrap: anywhere; word-break: break-word;
        }
        .signoff th { background: #f8fafc; font-size: 12px; color: var(--text-secondary); }
        .signoff td { height: 72px; font-size: 13px; color: var(--text-muted); }
        .matrix-score { font-weight: 700; }
        .score-ok { color: var(--ok); }
        .score-warn { color: var(--warn); }
        .score-crit { color: var(--crit); }
        .sc-risk { border-top-color: #0f172a; }
        .sc-risk .sc-number { color: #0f172a; font-size: 22px; }
        .muted-note { font-size: 12px; color: var(--text-secondary); margin: 0 0 12px; }
        .sys-link { font-size: 12px; margin-top: 8px; }
        .sys-link a { color: #1d4ed8; text-decoration: none; }
        .sys-link a:hover { text-decoration: underline; }

        /* ===== Footer ===== */
        .report-footer {
            text-align: center; color: var(--text-muted);
            font-size: 12px; padding: 24px 0 20px;
            border-top: 1px solid var(--border);
            margin-top: 20px;
        }

        /* ===== Print ===== */
        @media print {
            .sidebar { display: none; }
            .main-content { margin-left: 0; max-width: 100%; padding: 16px; }
            .check-card, .table-wrap { box-shadow: none; page-break-inside: avoid; }
            .table-wrap, .data-table-wrap { overflow: visible; scrollbar-gutter: auto; }
            .report-detail-table, .fleet-matrix-table, .category-matrix-table,
            .data-table.data-table-wide, .data-table.data-table-very-wide {
                width: 100%; min-width: 0; max-width: 100%; table-layout: fixed;
            }
            .check-table { font-size: 10px; }
            .check-table th, .check-table td { padding: 4px 6px; }
            .data-table th, .data-table td {
                padding: 2px 4px; max-width: none; font-size: 8px;
                overflow-wrap: anywhere; word-break: break-all;
            }
            .extra-content { display: block !important; }
            .extra-toggle { display: none; }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; max-width: 100%; padding: 16px; }
            .check-grid { grid-template-columns: 1fr; }
            .report-detail-table { min-width: 640px; }
            .check-table th, .check-table td { padding-left: 8px; padding-right: 8px; }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.extra-toggle').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var content = this.nextElementSibling;
                    if (content) {
                        content.classList.toggle('open');
                        this.textContent = content.classList.contains('open') ? '▾ 收起详情' : '▸ 展开详情';
                    }
                });
            });

            var navLinks = Array.from(document.querySelectorAll('.sidebar .nav-link[href^="#"]'));
            var targets = navLinks.map(function(link) {
                return document.getElementById(link.getAttribute('href').slice(1));
            }).filter(Boolean);

            function activateNavigation(id) {
                navLinks.forEach(function(link) {
                    var active = link.getAttribute('href') === '#' + id;
                    link.classList.toggle('active', active);
                    if (active) {
                        link.scrollIntoView({block: 'nearest'});
                    }
                });
            }

            navLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    activateNavigation(this.getAttribute('href').slice(1));
                });
            });

            if ('IntersectionObserver' in window) {
                var observer = new IntersectionObserver(function(entries) {
                    var visible = entries
                        .filter(function(entry) { return entry.isIntersecting; })
                        .sort(function(a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
                    if (visible.length) {
                        activateNavigation(visible[0].target.id);
                    }
                }, {rootMargin: '-12% 0px -72% 0px', threshold: 0});
                targets.forEach(function(target) { observer.observe(target); });
            }

            var initialId = window.location.hash.slice(1) || 'overview';
            activateNavigation(initialId);
        });
    </script>
</head>
<body>
    <div class="report-shell">
        <!-- 左侧导航栏 -->
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">${REPORT_BRAND}</div>
                <div class="title">${REPORT_TITLE}</div>
                <div class="meta">
                    <span>&#127968; ${HOSTNAME}</span>
                    <span>&#128421; ${SERVER_IP}</span>
                    ${SID_LINE}
                    <span>&#128339; ${COLLECT_TIME}</span>
                </div>
            </div>
            <div class="nav-group">
                <div class="nav-group-label">概览</div>
                ${OVERVIEW_NAV}
            </div>
            <div class="nav-group">
                <div class="nav-group-label">${DETAIL_NAV_LABEL}</div>
                ${SIDEBAR_NAV}
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="main-content">
            ${REPORT_BODY}
            <div class="report-footer">
                ${REPORT_FOOTER}
            </div>
        </div>
    </div>
</body>
</html>
